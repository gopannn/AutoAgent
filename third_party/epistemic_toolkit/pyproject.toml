[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-toolkit"
version = "2.0.0"
description = "Evidence ledgers, robustness gates, null-aware reporting, schema linting, proven single-source state machines, calibrated instruments and strict negative tests. Merged from SSIA-transferable-toolkit 1.0.0 and epistemic-toolkit 1.0.0."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
epistemic-toolkit = "epistemic_toolkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
