name: AI Software Compiler

# pull_request_target runs this workflow file and the compiler from the BASE branch.
# The pull request's files are only read as data, and its code runs only inside the
# gVisor sandbox. A PR therefore cannot weaken the gate that judges it, and the
# keyless signing identity is always ".../ai-compiler.yml@refs/heads/<base>".
# Never add a step that executes code from the `pr/` checkout on the runner.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ai-compiler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compile-and-verify:
    # Opt-in per repository (Settings -> Variables): VC_PROJECT_ROOT and VC_ENTRYPOINT.
    # Fork PRs are skipped: their branches cannot receive pushes from this token.
    if: >-
      vars.VC_PROJECT_ROOT != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # push the verified patch to the PR branch
      pull-requests: write   # post the report comment
      id-token: write        # keyless Sigstore signing

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: compiler_db
          POSTGRES_USER: compiler
          POSTGRES_PASSWORD: compiler_ci_only   # ephemeral database, reachable only from this runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compiler -d compiler_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      VC_PROJECT_ROOT: ${{ vars.VC_PROJECT_ROOT }}
      VC_ENTRYPOINT: ${{ vars.VC_ENTRYPOINT }}
      VC_MAX_REPAIR_ROUNDS: ${{ vars.VC_MAX_REPAIR_ROUNDS || '3' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out trusted compiler (base branch)
        uses: actions/checkout@v4
        with:
          path: base
          persist-credentials: false

      - name: Check out pull request head (data only)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: base/verification_compiler/requirements.txt

      - name: Install compiler dependencies
        run: python -m pip install -r base/verification_compiler/requirements.txt

      - name: Install gVisor (runsc) and register it with Docker
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update -q && sudo apt-get install -y -q runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc

      - name: Build verifier image and pin both images by digest
        run: |
          docker build -q -f base/verification_compiler/docker/verifier.Dockerfile -t vc-verifier:ci base/verification_compiler/docker
          echo "VC_VERIFIER_IMAGE=$(docker image inspect --format '{{.Id}}' vc-verifier:ci)" >> "$GITHUB_ENV"
          docker pull -q python:3.12-slim
          echo "VC_RUNTIME_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Run AI Software Compiler
        id: compile
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGGRAPH_POSTGRES_URI: postgresql://compiler:compiler_ci_only@localhost:5432/compiler_db
          LANGGRAPH_STRICT_MSGPACK: "true"
          # Untrusted text: passed via env only, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set +e
          python base/.github/scripts/run_compiler_pr.py \
            --repo-root "$GITHUB_WORKSPACE/pr" \
            --project-root "$VC_PROJECT_ROOT" \
            --entrypoint "$VC_ENTRYPOINT" \
            --report-dir "$RUNNER_TEMP/vc-report"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Sign release manifest (keyless)
        if: steps.compile.outputs.exit_code == '0' && steps.compile.outputs.manifest_updated == 'true'
        working-directory: pr
        run: |
          cosign sign-blob .verification/release_manifest.json \
            --bundle .verification/release_manifest.sigstore.json --yes

      - name: Push verified patch to the PR branch
        if: steps.compile.outputs.exit_code == '0'
        working-directory: pr
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$VC_PROJECT_ROOT" .verification
          if git diff --cached --quiet; then
            echo "Verified without changes; nothing to push."
            exit 0
          fi
          git commit -m "chore(ci): apply verified repair patch from AI Compiler" \
                     -m "Verified for ${HEAD_SHA}. See .verification/release_manifest.json."
          # Pushing the detached verified commit fails if the branch moved meanwhile,
          # so commits nobody verified are never overwritten.
          git push origin "HEAD:refs/heads/${HEAD_REF}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-compiler-pr-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/vc-report
            pr/.verification
          if-no-files-found: ignore

      - name: Post or update PR report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/vc-report/summary.md"
          [ -f "$body" ] || { echo "no report produced"; exit 0; }
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
                 --jq '.[] | select(.body | startswith("<!-- ai-compiler-report -->")) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$body" > /dev/null
          fi

      - name: Enforce release gate
        run: |
          code="${{ steps.compile.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "::error::AI compiler did not produce a release-ready build (exit ${code:-missing})"
            exit 1
          fi
